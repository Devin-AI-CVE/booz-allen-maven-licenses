# This workflow kicks off the releases a new version of booz-allen-licenses and deploys artifacts to Maven Central.

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release Booz Allen Licenses

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version"
        required: true
      developmentVersion:
        description: "Next development version"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python # use direct install rather than pyenv for CI for large speed improvement
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'

      - name: Load cached Poetry installation
        id: cached-poetry
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: poetry-0  # increment to reset cache

      - name: Install Poetry
        if: steps.cached-poetry.outputs.cache-hit != 'true'
        uses: snok/install-poetry@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: 'central'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Create settings.xml
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_CENTRAL_REPO_TOKEN_USER }}
          SONATYPE_KEY: ${{ secrets.SONATYPE_CENTRAL_REPO_TOKEN_KEY }}
          GHCR_USER: ${{ secrets.GHCR_IO_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_IO_TOKEN }}
          PYPI_USER: ${{ secrets.PYPI_USERNAME }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "<settings><servers><server><id>central</id><username>${SONATYPE_USER}</username><password>${SONATYPE_KEY}</password></server><server><id>ghcr.io</id><username>${GHCR_USER}</username><password>${GHCR_TOKEN}</password></server><server><id>pypi</id><username>${PYPI_USER}</username><password>${PYPI_TOKEN}</password></server></servers></settings>" > $HOME/.m2/settings.xml

      - name: Release Booz Allen Licenses
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          DEV_VERSION: ${{ inputs.developmentVersion }}
        run: |
          git config --local user.email "aissemble-noreply@bah.com"
          git config --local user.name "Github Actions"
          git checkout -b "${RELEASE_VERSION}-release"
          mvn -B release:clean release:prepare release:perform -Pcentral-release -DreleaseVersion="${RELEASE_VERSION}" -DdevelopmentVersion="${DEV_VERSION}" -Darguments="-Dhabushu.usePyenv=false"
          mvn release:update-versions -DdevelopmentVersion="${DEV_VERSION}"
          mvn clean install -Dhabushu.usePyenv=false
          mvn scm:checkin -Dmessage=":arrow_up: push example modules to version ${DEV_VERSION}"
